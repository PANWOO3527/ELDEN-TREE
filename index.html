<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="밤통 공략">
<meta name="theme-color" content="#0d1020">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>밤통 공략집</title>
<style>
:root{
  --bg:#0d1020; --bg2:#151a30; --card:#1b2140; --line:#2c3460;
  --text:#e8e6f0; --sub:#a4a8c4; --gold:#d6b25e; --gold2:#f0d68c;
  --holy:#f3d36b; --fire:#ff7a45; --light:#6cc7ff; --magic:#8f8bff;
  --poison:#8fd14f; --rot:#e0703c; --bleed:#e5484d; --frost:#9fe3ff;
  --sleep:#b99cff; --mad:#ffb020; --death:#9aa0a6; --phys:#c9c9c9;
  --safe-b: env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.6}
body{padding-bottom:calc(72px + var(--safe-b))}
header{position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,#0d1020 70%,rgba(13,16,32,.85));
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:19px;letter-spacing:.5px;color:var(--gold2)}
h1 small{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
#search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font-size:16px;outline:none}
#search:focus{border-color:var(--gold)}
main{padding:14px 16px;max-width:760px;margin:0 auto}
.sec-title{font-size:13px;color:var(--gold);letter-spacing:1px;margin:18px 2px 8px;font-weight:700}
.sec-title:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:14px;display:flex;gap:10px;align-items:flex-start}
details>summary::-webkit-details-marker{display:none}
.sum-main{flex:1;min-width:0}
.sum-title{font-weight:700;font-size:16px}
.sum-sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.chev{color:var(--sub);transition:transform .2s;margin-top:2px}
details[open] .chev{transform:rotate(90deg)}
.body{padding:0 14px 14px;border-top:1px solid var(--line)}
.body h4{margin:14px 0 6px;font-size:13px;color:var(--gold2)}
.body ul{margin:4px 0;padding-left:18px}
.body li{margin:3px 0}
.body p{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.weak{font-weight:700}
.chip.res{opacity:.75;border-style:dashed}
.c-holy{color:var(--holy)}.c-fire{color:var(--fire)}.c-light{color:var(--light)}.c-magic{color:var(--magic)}
.c-poison{color:var(--poison)}.c-rot{color:var(--rot)}.c-bleed{color:var(--bleed)}.c-frost{color:var(--frost)}
.c-sleep{color:var(--sleep)}.c-mad{color:var(--mad)}.c-death{color:var(--death)}.c-phys{color:var(--phys)}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.tip{background:rgba(214,178,94,.08);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:14px}
.warn{background:rgba(229,72,77,.08);border-left:3px solid var(--bleed);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:14px}
.nb-list{display:flex;flex-wrap:wrap;gap:6px}
.nb{font-size:12.5px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.nb.only{border-color:var(--gold);color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--gold2);font-weight:600;font-size:12.5px}
.memo{width:100%;min-height:64px;margin-top:6px;background:var(--bg2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;font-family:inherit;resize:vertical}
.memo-label{font-size:12px;color:var(--sub);margin-top:12px}
.clear-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);background:none;border:1px solid var(--line);
  border-radius:8px;padding:4px 10px;margin-top:6px}
.empty{color:var(--sub);text-align:center;padding:30px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#0a0d1a;
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:none;color:var(--sub);padding:9px 0 8px;font-size:11px;font-family:inherit}
nav button .ic{display:block;font-size:19px;line-height:1.2;margin-bottom:1px}
nav button.on{color:var(--gold2)}
.hidden{display:none!important}
.foot{color:var(--sub);font-size:11.5px;text-align:center;margin:24px 0 8px;line-height:1.5}
.check li{list-style:none;margin-left:-18px}
.check li::before{content:"☐ ";color:var(--gold)}
mark{background:rgba(214,178,94,.35);color:inherit;border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>🌙 밤의 통치자 공략집 <small>본편 기준 · DLC 제외</small></h1>
  <input id="search" type="search" placeholder="검색: 보스, 속성, 캐릭터… (예: 벼락, 리브라)" autocomplete="off">
</header>

<main>
  <section id="tab-guide"></section>
  <section id="tab-lords" class="hidden"></section>
  <section id="tab-night" class="hidden"></section>
  <section id="tab-chars" class="hidden"></section>
  <section id="tab-status" class="hidden"></section>
  <section id="tab-items" class="hidden"></section>
  <div id="search-results" class="hidden"></div>
  <div class="foot">정보 출처: 나무위키·팬 위키 등 커뮤니티 공략 (2026년 기준)<br>패치로 수치·패턴이 바뀔 수 있어요</div>
</main>

<nav>
  <button data-tab="guide" class="on"><span class="ic">📖</span>초보 가이드</button>
  <button data-tab="lords"><span class="ic">👑</span>밤의 왕</button>
  <button data-tab="night"><span class="ic">🌑</span>밤 보스</button>
  <button data-tab="chars"><span class="ic">🗡️</span>캐릭터</button>
  <button data-tab="items"><span class="ic">🔮</span>유물·템</button>
  <button data-tab="status"><span class="ic">🧪</span>속성·상태</button>
</nav>

<script>

};
const chip = (t, kind) => {
  const base = t.replace(/\(.*\)/,'').trim();
  return `<span class="chip ${kind||''} c-${EL[base]||'phys'}">${kind==='weak'?'약점 ':kind==='res'?'내성 ':''}${t}</span>`;
};

const GUIDE = [

/* ================= 렌더링 ================= */
const $ = s => document.querySelector(s);
const stars = n => `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
const li = arr => `<ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const mk = (title, sub, body, attrs='') =>
 `<details class="card" ${attrs}><summary><div class="sum-main"><div class="sum-title">${title}</div>${sub?`<div class="sum-sub">${sub}</div>`:''}</div><span class="chev">›</span></summary><div class="body">${body}</div></details>`;

function memoBox(key){
  let v=''; try{v=localStorage.getItem('memo_'+key)||''}catch(e){}
  return `<div class="memo-label">📝 내 메모 (이 기기에 저장)</div>
  <textarea class="memo" data-key="${key}" placeholder="예: 벼락 항아리 5개면 충분했음">${v.replace(/</g,'&lt;')}</textarea>`;
}

function renderGuide(){
  $('#tab-guide').innerHTML = `<div class="sec-title">초보 가이드</div>` +
   GUIDE.map((g,i)=>mk(g.t,g.s,g.b, i===0?'open':'')).join('');
}
function lordCard(L){
  const nbs = (arr)=> `<div class="nb-list">${arr.map(n=>`<span class="nb ${L.only.includes(n)?'only':''}">${n}</span>`).join('')}</div>`;
  const chips = `<div class="chips">${L.weak.map(w=>chip(w,'weak')).join('')}${L.res.map(r=>chip(r,'res')).join('')}</div>`;
  const body = `
   <h4>공격 속성</h4><div class="chips">${L.atk.map(a=>chip(a)).join('')}</div>
   <h4>특징 · 패턴</h4>${li(L.feat)}
   <h4>준비물</h4>${li(L.prep)}
   ${L.deal?`<h4>거래 선택 참고</h4>${li(L.deal)}`:''}
   <h4>1일차 밤 보스 후보</h4>${nbs(L.night1)}
   <h4>2일차 밤 보스 후보</h4>${nbs(L.night2)}
   ${L.only.length?`<p class="sum-sub">금색 테두리 = 이 원정에서만 나오는 밤 보스</p>`:''}
   ${memoBox(L.id)}`;
  return `<details class="card" data-id="${L.id}"><summary><div class="sum-main">
    <div class="sum-title">${L.name}</div>
    <div class="sum-sub">원정: ${L.exp} · 체감 난이도 ${stars(L.diff)}</div>${chips}
   </div><span class="chev">›</span></summary><div class="body">${body}</div></details>`;
}
function renderLords(){
  $('#tab-lords').innerHTML = `<div class="sec-title">밤의 왕 8종</div>
   <div class="tip">약점 속성 판정은 <b>맞았을 때 뜨는 속성 이펙트</b> 기준이라, 약점 외 다른 인챈트가 섞이면 기믹이 안 터질 수 있어요.</div>` +
   LORDS.map(lordCard).join('') +
   `<p class="sum-sub">체감 난이도는 커뮤니티 평가를 참고한 대략적인 값이에요.</p>`;
}
function renderNight(){
  // 밤 보스 → 등장 원정 역인덱스
  const map = {};
  LORDS.filter(L=>L.id!=='nameless').forEach(L=>{
    [...L.night1.map(n=>[n,1]),...L.night2.map(n=>[n,2])].forEach(([n,d])=>{
      map[n] = map[n] || {d, lords:[]}; map[n].lords.push(L.exp);
    });
  });
  const block = d => Object.entries(map).filter(([,v])=>v.d===d).map(([n,v])=>
    mk(n, `등장: ${v.lords.join(', ')}`, `<p>${NB_TIPS[n]||'특별한 기믹 정보 없음 — 기본 패턴 파악 위주'}</p>`)).join('');
  $('#tab-night').innerHTML =
   `<div class="sec-title">1일차 밤 보스</div>
    <div class="tip">밤 보스는 <b>어떤 밤의 왕을 골랐는지</b>에 따라 후보가 정해져요. 최종 보스(밤을 본뜬 자) 출격에선 전부 나올 수 있어요.</div>` +
   block(1) + `<div class="sec-title">2일차 밤 보스</div>` + block(2);
}

/* ================= 탭 · 검색 ================= */
let current='guide';
function show(tab){
  current=tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['guide','lords','night','chars','items','status'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==tab));
  $('#search-results').classList.add('hidden'); $('#search').value='';
  try{localStorage.setItem('tab',tab)}catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));

$('#search').addEventListener('input',e=>{
  const q=e.target.value.trim();
  const res=$('#search-results');
  if(!q){ res.classList.add('hidden'); $('#tab-'+current).classList.remove('hidden'); return; }
  $('#tab-'+current).classList.add('hidden');
  const hits=[];
  document.querySelectorAll('main section details').forEach(d=>{
    const c=d.cloneNode(true);
    c.querySelectorAll('.memo,.memo-label').forEach(m=>m.remove());
    if(c.textContent.includes(q)) hits.push(c.outerHTML);
  });
  const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  res.innerHTML = `<div class="sec-title">"${q.replace(/</g,'&lt;')}" 검색 결과 ${hits.length}건</div>` +
    (hits.length ? hits.map(h=>h.replace(/<details/,'<details open')
      .replace(new RegExp(`(>[^<]*?)(${esc})`,'g'),'$1<mark>$2</mark>')).join('')
     : `<div class="empty">결과가 없어요</div>`);
  res.classList.remove('hidden');
});

document.addEventListener('input',e=>{
  if(e.target.classList.contains('memo')){
    const k=e.target.dataset.key;
    try{localStorage.setItem('memo_'+k,e.target.value)}catch(err){}
    document.querySelectorAll(`.memo[data-key="${k}"]`).forEach(m=>{ if(m!==e.target) m.value=e.target.value; });
  }
});

renderGuide(); renderLords(); renderNight(); renderChars(); renderItems(); renderStatus();
let saved='guide'; try{saved=localStorage.getItem('tab')||'guide'}catch(e){}
show(saved);
</script>
